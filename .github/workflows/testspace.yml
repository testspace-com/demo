# Runs a spec's automated fixture when a tester starts it in Testspace.
# Testspace dispatches this workflow; a spec's "name: github::setup" selects the job below.
# See https://help.testspace.com/manual/automated-fixtures
name: Testspace
run-name: ${{ fromJSON(inputs.context).spec.name }}
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Function name'
        required: true
      payload:
        description: 'Function input-payload'
        required: true
      context:
        description: 'Function execution-context'
        required: true
env:
  IN_NAME:    ${{ inputs.name }}
  IN_PAYLOAD: ${{ inputs.payload }}
  IN_CONTEXT: ${{ inputs.context }}
jobs:
  setup:
    if: inputs.name == 'setup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the system for the spec
        # A real fixture would read the spec's payload from the IN_PAYLOAD environment variable.
        run: echo "running the ${IN_NAME} fixture"
